# Render Blueprint — backend (Phase 16, academic demonstration deployment).
# Express API on a Render Free Web Service; PostgreSQL on Neon (DATABASE_URL); the frontend on Vercel
# proxies /api/* to this service (frontend/next.config.ts), so the browser only sees the frontend origin.
#
# Secrets are never stored here: values marked `sync: false` are entered in the Render dashboard when the
# Blueprint is created; JWT_SECRET is generated by Render. Migrations are applied with
# `prisma migrate deploy` (never `migrate dev` / `db push`) during each build.
services:
  - type: web
    name: caesar-backend
    runtime: node
    plan: free
    region: singapore
    rootDir: backend
    buildCommand: npm ci --include=dev && npx prisma generate && npx prisma migrate deploy && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      # Signs session and reset tokens (at least 32 characters); generated once by Render.
      - key: JWT_SECRET
        generateValue: true
      # Neon connection string (the direct, non-pooled one, with sslmode=require).
      - key: DATABASE_URL
        sync: false
      # The Vercel frontend's origin, e.g. https://<project>.vercel.app (no trailing slash).
      - key: CORS_ORIGIN
        sync: false
      # One proxy hop: Render's load balancer. Not more, so a client calling this service directly
      # cannot choose the IP that the sign-in rate limits count.
      - key: TRUST_PROXY
        value: "1"
      # SMTP for professor sign-in details and password recovery. Render Free blocks ports 25, 465
      # and 587: use a relay that accepts port 2525 (e.g. Brevo: smtp-relay.brevo.com, 2525, SMTP_SECURE=false).
      - key: SMTP_HOST
        sync: false
      - key: SMTP_PORT
        sync: false
      - key: SMTP_SECURE
        sync: false
      - key: SMTP_USER
        sync: false
      - key: SMTP_PASSWORD
        sync: false
      - key: MAIL_FROM
        sync: false
